name: ig-topup
on:
  schedule:
    - cron: "0 6 * * *"     # 11:30 IST
    - cron: "0 18 * * *"    # 23:30 IST (exits in ~1 min when both pages are 30+ days ahead)
  workflow_dispatch:
    inputs:
      dry_run: {type: boolean, default: true}
      e2e: {type: boolean, default: false, description: 'tests + side-effect-free trending/top-up render and QA'}
concurrency: {group: ig-studio, cancel-in-progress: false}   # trending + top-up never run at the same time
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {repository: pruthvi895/ig-studio, token: "${{ secrets.GH_PAT }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: box/requirements-ci.txt}
      - name: ffmpeg + text shaping libs (full apt install; a partial apt cache missed ffmpeg's libblas)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg libfribidi0 libraqm0 >/dev/null && ffmpeg -version | head -1 && ffprobe -version | head -1
      - run: pip install -q -r box/requirements-ci.txt
      - name: topup
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash box/ci_job.sh ${{ inputs.e2e && 'e2e' || 'topup' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
