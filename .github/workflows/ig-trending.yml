name: ig-trending
on:
  schedule:
    - cron: "15 5 * * *"    # 10:45 IST
    - cron: "15 8 * * *"    # 13:45 IST catch-up (idempotent: max 1 trending post/page/day)
  workflow_dispatch:
    inputs: {dry_run: {type: boolean, default: true}}
concurrency: {group: ig-studio, cancel-in-progress: false}   # trending + top-up never run at the same time
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {repository: pruthvi895/ig-studio, token: "${{ secrets.GH_PAT }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: box/requirements-ci.txt}
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with: {packages: ffmpeg libfribidi0 libraqm0, version: "1"}
      - run: pip install -q -r box/requirements-ci.txt
      - name: trending
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash box/ci_job.sh trending ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
